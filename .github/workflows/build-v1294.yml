name: Build V1294

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-v1294.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate V1294
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          src = Path("index.html")
          dst = Path("index V-1294.html")
          text = src.read_text(encoding="utf-8")

          expected = "<title>Simulateur technique EVO-Sun — V1293</title>"
          if expected not in text:
              raise SystemExit("Base V1293 non trouvée dans index.html")

          text = re.sub(r"(?<!\\d)V1293(?!\\d)", "V1294", text)

          text = text.replace(">Créer dans Odoo</button>", ">Envoyer vers Odoo</button>")
          text = text.replace("Création…", "Envoi vers Odoo…")
          text = text.replace("Créer dans Odoo", "Envoyer vers Odoo")

          css = """
          /* V1294 — Admin / Catalogue Victron : espace agrandi, sans ascenseur interne */
          body.admin-open [data-admin-theme-content="victron-catalog"].active{
            min-height:calc(100vh - 190px)!important;
            overflow:visible!important;
          }
          body.admin-open [data-admin-theme-content="victron-catalog"]{
            overflow:visible!important;
          }
          body.admin-open [data-admin-theme-content="victron-catalog"] .victron-catalog-list{
            display:grid!important;
            gap:8px!important;
            min-height:68vh!important;
            max-height:none!important;
            overflow:visible!important;
            align-content:start!important;
            padding:6px 10px 16px 2px!important;
          }
          """

          marker = '<style id="v1187BundledStyles">'
          p = text.find(marker)
          if p < 0:
              raise SystemExit("Style principal introuvable")
          q = text.find("</style>", p)
          if q < 0:
              raise SystemExit("Fin du style principal introuvable")
          text = text[:q] + css + "\n" + text[q:]

          if "<title>Simulateur technique EVO-Sun — V1294</title>" not in text:
              raise SystemExit("Version V1294 non appliquée")
          if "Envoyer vers Odoo" not in text:
              raise SystemExit("Bouton Odoo non modifié")
          if "create_victron_product" not in text:
              raise SystemExit("Flux Victron absent")
          if not text.rstrip().endswith("</html>"):
              raise SystemExit("HTML incomplet")

          dst.write_text(text, encoding="utf-8")
          print(dst, dst.stat().st_size)
          PY

      - name: Commit V1294
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "index V-1294.html"
          git commit -m "V1294 - Catalogue Victron et envoi Odoo"
          git push

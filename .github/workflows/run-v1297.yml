name: Run V1297

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-v1297.yml"
      - ".github/scripts/build_v1297.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate V1297
        run: python3 .github/scripts/build_v1297.py
      - name: Commit V1297
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "index V-1297.html"
          git commit -m "V1297 - sécuriser synchronisation catalogue Victron"
          git push

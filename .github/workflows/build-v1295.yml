name: Build V1295

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-v1295.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate V1295
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          src = Path("index V-1294.html")
          dst = Path("index V-1295.html")
          text = src.read_text(encoding="utf-8")

          if "<title>Simulateur technique EVO-Sun — V1294</title>" not in text:
              raise SystemExit("Base V1294 non trouvée")

          text = re.sub(r"(?<!\d)V1294(?!\d)", "V1295", text)

          pattern = re.compile(
              r"function resolvedSmartSolarNominalPvPower\(controller,battery,batteryReference\)\{.*?\n  \}",
              re.S
          )
          replacement = (
              "function resolvedSmartSolarNominalPvPower(controller,battery,batteryReference){\n"
              "    const pvMap=(controller?.pv&&typeof controller.pv==='object')?controller.pv:{},\n"
              "      declaredVoltages=[12,24,48].filter(voltage=>Number(pvMap?.[voltage])>0),\n"
              "      byDatasheet=Number(pvMap?.[battery]);\n\n"
              "    /* V1295 — si une fiche technique déclare des puissances PV par tension,\n"
              "       seules ces tensions sont compatibles. Une tension absente n'est jamais\n"
              "       inventée par le fallback Vbat × courant de charge. */\n"
              "    if(declaredVoltages.length){\n"
              "      return Number.isFinite(byDatasheet)&&byDatasheet>0?byDatasheet:0\n"
              "    }\n\n"
              "    /* Fallback réservé aux anciens produits sans pv12 / pv24 / pv48. */\n"
              "    const fallback=Number(batteryReference||battery||0)*Number(controller?.chargeA||0);\n"
              "    return Number.isFinite(fallback)&&fallback>0?fallback:0\n"
              "  }"
          )

          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Fonction SmartSolar non remplacée")

          old_doc = (
              "7. Puissance PV admissible par appareil = tension batterie de référence × courant de charge × (1 + surcharge configurée).\n"
              "         Références : 13 V / 26 V / 52 V pour systèmes 12 V / 24 V / 48 V."
          )
          new_doc = (
              "7. Puissance PV admissible par appareil = valeur de fiche technique pv12/pv24/pv48 lorsqu'elle existe.\n"
              "         Si au moins une puissance par tension est déclarée, toute tension absente est incompatible.\n"
              "         Le calcul tension batterie × courant de charge reste uniquement un fallback pour les anciens produits sans aucune donnée PV par tension."
          )
          text = text.replace(old_doc, new_doc, 1)

          required = [
              "<title>Simulateur technique EVO-Sun — V1295</title>",
              "declaredVoltages.length",
              "pv:{48:11520}",
              "SmartSolar MPPT RS 450/200",
              "pv:{48:5760}",
              "SmartSolar MPPT RS 450/100",
              "create_victron_product"
          ]
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit("Validation V1295 échouée: " + repr(missing))
          if not text.rstrip().endswith("</html>"):
              raise SystemExit("HTML incomplet")

          dst.write_text(text, encoding="utf-8")
          print(f"Créé: {dst} ({dst.stat().st_size} octets)")
          PY

      - name: Commit V1295
        shell: bash
        run: |
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "index V-1295.html"
          git commit -m "V1295 - corriger compatibilité tension SmartSolar PT"
          git push

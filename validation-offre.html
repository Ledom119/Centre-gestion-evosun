<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Validation de l’offre</title>

<style>
:root{
  --green:#c5f90b;
  --dark:#172026;
  --line:#dce4df;
  --soft:#f4f7f5;
  --muted:#68757a;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#eef2ef;
  color:var(--dark);
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  max-width:920px;
  margin:30px auto;
  padding:0 18px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 12px 36px rgba(23,32,38,.12);
  overflow:hidden;
}

.head{
  min-height:92px;
  background:var(--dark);
  color:#fff;
  padding:18px 28px;
  border-bottom:4px solid var(--green);

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.company-logo{
  display:block;
  max-width:220px;
  max-height:58px;
  width:auto;
  height:auto;
  object-fit:contain;
}

.company-name-fallback{
  font-size:24px;
  font-weight:900;
  color:#fff;
}

.head-title{
  color:var(--green);
  font-size:20px;
  font-weight:950;
  text-align:right;
  text-transform:uppercase;
}

.main{
  padding:28px;
}

h1{
  margin:2px 0 10px;
  font-size:34px;
  line-height:1.1;
}

.muted{
  color:var(--muted);
  line-height:1.55;
  font-size:16px;
}

.meta{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
  margin:24px 0 22px;
}

.meta-card{
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px 16px;
  min-height:92px;
  background:#fff;
}

.meta-card span{
  display:block;
  margin-bottom:5px;
  font-size:9px;
  text-transform:uppercase;
  font-weight:950;
  letter-spacing:.06em;
  color:#78848a;
}

.meta-card strong{
  display:block;
  font-size:16px;
  line-height:1.2;
}

.reference-link{
  display:inline-block;
  color:var(--dark);
  text-decoration:none;
  border-bottom:2px solid var(--green);
}

.reference-link:hover{
  color:#759600;
}

.pdf-download{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  margin-top:11px;
  padding:8px 12px;

  border:1px solid var(--dark);
  border-radius:999px;

  color:var(--dark);
  background:#fff;

  text-decoration:none;
  font-size:11px;
  font-weight:900;

  transition:.15s ease;
}

.pdf-download:hover{
  background:var(--green);
}

.pdf-download[hidden]{
  display:none;
}

.pdf-unavailable{
  display:block;
  margin-top:9px;
  font-size:10px;
  color:#899398;
}

.base{
  background:var(--dark);
  color:#fff;

  padding:17px 19px;
  border-radius:15px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:18px;
}

.base b{
  font-size:16px;
}

.base strong{
  color:var(--green);
  font-size:29px;
}

.opts{
  display:grid;
  gap:11px;
}

.opt{
  display:flex;
  gap:13px;
  align-items:center;

  border:1px solid var(--line);
  border-radius:14px;

  padding:15px 16px;
  background:#fff;

  cursor:pointer;
}

.opt:hover{
  border-color:#b8ce73;
}

.opt:has(input:checked){
  background:#f5fae9;
  border-color:#a9c94c;
}

.opt input{
  width:22px;
  height:22px;
  accent-color:var(--green);
  cursor:pointer;
}

.opt .copy{
  flex:1;
}

.opt .copy b{
  display:block;
  font-size:16px;
}

.opt small{
  color:var(--muted);
}

.opt-price{
  font-size:15px;
  font-weight:900;
  white-space:nowrap;
}

.sum{
  margin-top:22px;
  padding-top:16px;
  border-top:1px solid var(--line);
}

.row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  padding:6px 0;
}

.row.total{
  font-size:23px;
  font-weight:950;

  border-top:1px solid var(--line);

  margin-top:8px;
  padding-top:14px;
}

.row.total strong{
  color:#759600;
}

button{
  width:100%;

  margin-top:22px;
  min-height:58px;

  border:2px solid var(--dark);
  border-radius:999px;

  background:var(--green);
  color:var(--dark);

  font-size:18px;
  font-weight:950;

  cursor:pointer;
}

button:hover{
  background:#d7ff43;
}

button:disabled{
  opacity:.55;
  cursor:wait;
}

.loading,
.error,
.success{
  text-align:center;
  padding:55px 25px;
}

.error{
  color:#9b2c22;
}

.success h1{
  margin-bottom:10px;
}

.success-total{
  margin-top:25px;
  font-size:22px;
}

.success-total strong{
  color:#759600;
}

.footer-note{
  margin-top:14px;
  text-align:center;
  color:#8a9498;
  font-size:10px;
  line-height:1.5;
}

@media(max-width:700px){

  .wrap{
    margin:0;
    padding:0;
  }

  .card{
    min-height:100vh;
    border-radius:0;
  }

  .head{
    align-items:flex-start;
    flex-direction:column;
  }

  .head-title{
    text-align:left;
    font-size:16px;
  }

  .company-logo{
    max-width:190px;
    max-height:50px;
  }

  .main{
    padding:22px 18px;
  }

  h1{
    font-size:28px;
  }

  .meta{
    grid-template-columns:1fr;
  }

  .base strong{
    font-size:23px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="card">

    <div class="head">

      <div id="companyIdentity">

        <span
          id="companyNameFallback"
          class="company-name-fallback"
        >
          EVO-SUN
        </span>

        <img
          id="companyLogo"
          class="company-logo"
          alt="Logo société"
          hidden
        >

      </div>

      <div class="head-title">
        Validation de l’offre
      </div>

    </div>

    <div id="app" class="main">

      <div class="loading">
        Chargement de votre offre...
      </div>

    </div>

  </div>

</div>

<script>

const API =
  'https://jcajdwqrjuavedzkevfd.supabase.co/functions/v1/clever-processor';

const params =
  new URLSearchParams(
    window.location.search
  );

const quote =
  params.get('quote') || '';

const exp =
  params.get('exp') || '';

const data =
  params.get('data') || '';

const sig =
  params.get('sig') || '';

const app =
  document.getElementById('app');

const companyLogo =
  document.getElementById(
    'companyLogo'
  );

const companyNameFallback =
  document.getElementById(
    'companyNameFallback'
  );

const esc = value =>
  String(value ?? '')
    .replace(
      /[&<>"']/g,
      character => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[character])
    );

const eur = value =>
  new Intl.NumberFormat(
    'fr-BE',
    {
      style:'currency',
      currency:'EUR',
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  ).format(
    Number(value) || 0
  );

function configureCompany(
  validation
){

  const companyName =
    String(
      validation.companyName ||
      validation.company ||
      'EVO-Sun'
    );

  const logoUrl =
    String(
      validation.companyLogoUrl ||
      validation.logoUrl ||
      ''
    ).trim();

  companyNameFallback.textContent =
    companyName;

  if(
    logoUrl &&
    /^https:\/\//i.test(
      logoUrl
    )
  ){

    companyLogo.src =
      logoUrl;

    companyLogo.alt =
      companyName;

    companyLogo.hidden =
      false;

    companyNameFallback.hidden =
      true;

    companyLogo.onerror =
      () => {

        companyLogo.hidden =
          true;

        companyNameFallback.hidden =
          false;

      };

  }else{

    companyLogo.hidden =
      true;

    companyNameFallback.hidden =
      false;

  }
}

async function load(){

  try{

    const requestUrl =
      new URL(API);

    requestUrl
      .searchParams
      .set(
        'mode',
        'public_data'
      );

    requestUrl
      .searchParams
      .set(
        'quote',
        quote
      );

    requestUrl
      .searchParams
      .set(
        'exp',
        exp
      );

    requestUrl
      .searchParams
      .set(
        'data',
        data
      );

    requestUrl
      .searchParams
      .set(
        'sig',
        sig
      );

    const response =
      await fetch(
        requestUrl
      );

    const result =
      await response
        .json();

    if(
      !response.ok ||
      !result.ok
    ){

      throw new Error(
        result.error ||
        `HTTP ${response.status}`
      );

    }

    const validation =
      result.validation || {};

    configureCompany(
      validation
    );

    render(
      validation
    );

  }catch(error){

    app.innerHTML =
      `
      <div class="error">

        <h2>
          Validation indisponible
        </h2>

        <p>
          ${esc(
            error.message ||
            error
          )}
        </p>

      </div>
      `;

  }
}

function render(
  validation
){

  const config =
    validation.config || {};

  const options =
    Array.isArray(
      validation.options
    )
      ? validation.options
      : [];

  const quotePdfUrl =
    String(
      validation.quotePdfUrl ||
      validation.pdfUrl ||
      ''
    ).trim();

  const hasPdf =
    /^https:\/\//i.test(
      quotePdfUrl
    );

  const reference =
    String(
      validation.reference ||
      '-'
    );

  app.innerHTML =
    `
    <h1>
      Validation de l’offre
    </h1>

    <p class="muted">
      ${esc(
        config.pageIntro ||
        'Sélectionnez les options que vous souhaitez retenir. Le total se recalcule automatiquement avant votre confirmation.'
      )}
    </p>

    <div class="meta">

      <div class="meta-card">

        <span>
          Client
        </span>

        <strong>
          ${esc(
            validation.client ||
            '-'
          )}
        </strong>

      </div>

      <div class="meta-card">

        <span>
          Référence
        </span>

        ${
          hasPdf
            ? `
              <strong>
                <a
                  class="reference-link"
                  href="${esc(quotePdfUrl)}"
                  target="_blank"
                  rel="noopener noreferrer"
                  title="Ouvrir le devis PDF"
                >
                  ${esc(reference)}
                </a>
              </strong>

              <a
                class="pdf-download"
                href="${esc(quotePdfUrl)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                📄 Télécharger le devis PDF
              </a>
            `
            : `
              <strong>
                ${esc(reference)}
              </strong>

              <span class="pdf-unavailable">
                PDF du devis non disponible
              </span>
            `
        }

      </div>

      <div class="meta-card">

        <span>
          Projet
        </span>

        <strong>
          ${esc(
            validation.project ||
            '-'
          )}
        </strong>

      </div>

    </div>

    <div class="base">

      <b>
        Montant de base TVAC
      </b>

      <strong>
        ${eur(
          validation.baseAmount
        )}
      </strong>

    </div>

    <div class="opts">

      ${
        options.length
          ? options.map(
              (
                option,
                index
              ) =>
                `
                <label class="opt">

                  <input
                    type="checkbox"
                    data-key="${esc(
                      option.key ||
                      `option-${index}`
                    )}"
                    data-amount="${
                      Number(
                        option.amount
                      ) || 0
                    }"
                  >

                  <span class="copy">

                    <b>
                      ${esc(
                        option.name ||
                        'Option'
                      )}
                    </b>

                    <small>
                      Quantité ${
                        Math.max(
                          1,
                          Number(
                            option.quantity
                          ) || 1
                        )
                      }
                    </small>

                  </span>

                  <span class="opt-price">
                    ${eur(
                      option.amount
                    )}
                  </span>

                </label>
                `
            ).join('')
          : `
            <div class="opt">
              Aucune option supplémentaire proposée.
            </div>
          `
      }

    </div>

    <div class="sum">

      <div class="row">

        <span>
          Montant de base
        </span>

        <b>
          ${eur(
            validation.baseAmount
          )}
        </b>

      </div>

      <div class="row">

        <span>
          Options sélectionnées
        </span>

        <b id="optionsTotal">
          0,00 €
        </b>

      </div>

      <div class="row total">

        <span>
          Total validé
        </span>

        <strong id="grandTotal">
          ${eur(
            validation.baseAmount
          )}
        </strong>

      </div>

    </div>

    <button id="confirm">

      ${esc(
        config.pageConfirmLabel ||
        'CONFIRMER MON ACCORD'
      )}

    </button>

    <div class="footer-note">
      Votre validation est enregistrée de manière sécurisée
      et associée à la référence de votre offre.
    </div>
    `;

  document
    .querySelectorAll(
      'input[type=checkbox]'
    )
    .forEach(
      checkbox =>
        checkbox.addEventListener(
          'change',
          () =>
            updateTotals(
              validation
            )
        )
    );

  document
    .getElementById(
      'confirm'
    )
    .onclick =
      () =>
        confirmValidation(
          validation
        );

  updateTotals(
    validation
  );
}

function updateTotals(
  validation
){

  let optionsTotal =
    0;

  document
    .querySelectorAll(
      'input[type=checkbox]:checked'
    )
    .forEach(
      checkbox => {

        optionsTotal +=
          Number(
            checkbox.dataset.amount
          ) || 0;

      }
    );

  document
    .getElementById(
      'optionsTotal'
    )
    .textContent =
      eur(
        optionsTotal
      );

  document
    .getElementById(
      'grandTotal'
    )
    .textContent =
      eur(
        (
          Number(
            validation.baseAmount
          ) || 0
        )
        +
        optionsTotal
      );
}

async function confirmValidation(
  validation
){

  const button =
    document.getElementById(
      'confirm'
    );

  button.disabled =
    true;

  button.textContent =
    'ENREGISTREMENT...';

  try{

    const selectedOptionKeys =
      [
        ...document
          .querySelectorAll(
            'input[type=checkbox]:checked'
          )
      ]
      .map(
        checkbox =>
          checkbox.dataset.key
      );

    const response =
      await fetch(
        API,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:
            JSON.stringify({

              mode:
                'confirm_validation',

              quoteId:
                quote,

              exp,

              data,

              sig,

              selectedOptionKeys

            })
        }
      );

    const result =
      await response
        .json();

    if(
      !response.ok ||
      !result.ok
    ){

      throw new Error(
        result.error ||
        `HTTP ${response.status}`
      );

    }

    const confirmed =
      result.validation || {};

    app.innerHTML =
      `
      <div class="success">

        <h1>
          ${esc(
            validation.config
              ?.confirmationTitle
            ||
            'Merci, votre validation est enregistrée.'
          )}
        </h1>

        <p class="muted">
          ${esc(
            validation.config
              ?.confirmationBody
            ||
            'Votre choix a été transmis à EVO-Sun.'
          )}
        </p>

        <p>

          <strong>
            ${esc(
              confirmed.reference ||
              validation.reference ||
              ''
            )}
          </strong>

        </p>

        <div class="success-total">

          Total validé :

          <strong>
            ${eur(
              confirmed.finalAmount
            )}
          </strong>

        </div>

      </div>
      `;

  }catch(error){

    button.disabled =
      false;

    button.textContent =
      validation.config
        ?.pageConfirmLabel
      ||
      'CONFIRMER MON ACCORD';

    window.alert(
      error.message ||
      error
    );
  }
}

load();
</script>

</body>
</html>
